name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Files check
        run: find . -type f -not -path "./.git/*" | sort > log.txt
      - name: Build
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee -a log.txt; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-result
          path: |
            log.txt
            app/build/outputs/apk/debug/*.apk
